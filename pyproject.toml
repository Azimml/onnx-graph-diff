[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onnx-graph-diff"
version = "0.1.0"
description = "Static ONNX graph rematching with fingerprints and LLM heuristics"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Azimbek Olimbekov" }]
keywords = ["onnx", "graph", "diff", "compiler", "optimization", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "jsonschema>=4.20",
  "langgraph>=1.0",
  "networkx>=3.2",
  "numpy>=1.24",
  "onnx>=1.20",
  "openai>=2.0",
  "pydantic>=2.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
onnx-graph-diff = "onnx_graph_diff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
]
ignore = [
  "E501", # line length is handled by the formatter
]

[tool.ruff.lint.isort]
known-first-party = ["onnx_graph_diff"]

[tool.mypy]
# Parse using the interpreter mypy runs under (the numpy stubs use 3.12+ syntax).
# The package itself targets 3.10+; runtime compatibility is enforced by ruff's
# target-version and the CI test matrix.
python_version = "3.12"
files = ["src"]
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# Third-party packages that ship without complete type information.
module = ["onnx.*", "networkx.*", "langgraph.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["onnx_graph_diff"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
